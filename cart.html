<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeCart - Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="preloader"><div class="spinner-border text-primary" role="status"></div></div>
    <div id="header-container"></div>
    
    <div class="bg-light py-5 mb-5 border-bottom">
        <div class="container text-center">
            <h1 class="fw-bold display-5">Shopping Cart</h1>
        </div>
    </div>

    <div class="container py-4 min-vh-50">
        <div class="row g-5">
            <div class="col-lg-8">
                <div class="table-responsive shadow-sm rounded-4 bg-white p-3">
                    <table class="table table-borderless align-middle mb-0">
                        <thead class="bg-light text-muted small text-uppercase">
                            <tr>
                                <th class="py-3 rounded-start">Product Details</th>
                                <th class="py-3">Price</th>
                                <th class="py-3">Quantity</th>
                                <th class="py-3">Subtotal</th>
                                <th class="py-3 rounded-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items" class="border-top border-light">
                            <!-- Items here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Order Summary</h5>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Subtotal</span>
                            <span id="cart-total" class="fw-medium text-dark"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-4 text-muted">
                            <span>Shipping</span>
                            <span class="text-success fw-medium">Free</span>
                        </div>
                        <hr class="border-light mb-4">
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold fs-5">Total</span>
                            <span class="fw-bold fs-5 text-primary" id="cart-total-final">See Subtotal</span>
                        </div>
                        <a href="checkout.html" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow" id="checkout-btn">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <button id="scrollToTop" class="btn btn-primary"><i class="fas fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
