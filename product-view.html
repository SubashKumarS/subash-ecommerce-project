<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeCart - Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="preloader"><div class="spinner-border text-primary" role="status"></div></div>
    <div id="header-container"></div>
    
    <div class="bg-light py-3 mb-4">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item"><a href="products.html" class="text-decoration-none">Products</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Details</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container py-4 mt-2 min-vh-50">
        <div class="row mb-5">
            <div class="col-md-6 mb-4 mb-md-0 pe-lg-5">
                <img id="pv-img" src="" alt="Product Image" class="img-fluid rounded-4 shadow object-fit-cover w-100" style="height: 550px;">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <span id="pv-cat" class="text-primary fw-bold text-uppercase tracking-wide mb-2 small"></span>
                <h1 id="pv-title" class="fw-bold mb-3 display-5">Loading...</h1>
                <div class="d-flex align-items-center mb-4">
                    <span id="pv-rating" class="fs-5 me-2"></span>
                    <span class="text-muted small px-2 border-start border-2">(Customer Reviews)</span>
                </div>
                <h2 id="pv-price" class="text-dark fw-bold mb-4 display-6"></h2>
                
                <h5 class="fw-bold mt-2">Description</h5>
                <p id="pv-desc" class="text-muted mb-4 pb-4 border-bottom lh-lg"></p>
                
                <div class="d-flex gap-3 mb-4">
                    <button class="btn btn-primary btn-lg rounded-pill px-5 shadow" id="pv-add-cart">
                        <i class="fas fa-shopping-cart me-2"></i> Add to Cart
                    </button>
                    <button class="btn btn-outline-danger btn-lg rounded-circle" style="width: 50px; height: 50px; padding: 0;">
                        <i class="far fa-heart"></i>
                    </button>
                </div>
                
                <div class="mt-2 text-muted small bg-light p-3 rounded">
                    <div class="d-flex align-items-center mb-2">
                        <i class="fas fa-truck text-primary fs-5 me-3 w-20 text-center"></i> 
                        <span>Free delivery on orders over $50</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <i class="fas fa-undo text-primary fs-5 me-3 w-20 text-center"></i> 
                        <span>Return delivery within 30 days</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Products -->
        <div class="mt-5 pt-5 border-top">
            <h3 class="fw-bold mb-4 text-center">You Might Also Like</h3>
            <div class="row" id="pv-related">
                <!-- Dynamic related products -->
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <button id="scrollToTop" class="btn btn-primary"><i class="fas fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
