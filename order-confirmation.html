<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeCart - Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="preloader"><div class="spinner-border text-primary" role="status"></div></div>
    <div id="header-container"></div>
    
    <div class="container py-5 mt-5 text-center d-flex flex-column justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="bg-success bg-opacity-10 p-4 rounded-circle mb-4 text-success shadow-sm">
            <i class="fas fa-check-circle" style="font-size: 5rem;"></i>
        </div>
        <h1 class="fw-bold mb-3">Order Placed Successfully!</h1>
        <p class="lead text-muted mb-2">Thank you for your purchase.</p>
        <div class="bg-white p-4 rounded-4 shadow-sm my-4 text-start">
            <p class="mb-2">Order ID: <strong id="order-id" class="text-primary fs-5"></strong></p>
            <p class="mb-0 text-muted">We've sent an order confirmation email to you with tracking information.</p>
        </div>
        <a href="index.html" class="btn btn-primary rounded-pill px-5 py-3 shadow">Continue Shopping</a>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('order-id').innerText = '#' + (params.get('id') || '482910');
    </script>
</body>
</html>
