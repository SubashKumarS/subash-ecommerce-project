<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeCart - All Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="preloader"><div class="spinner-border text-primary" role="status"></div></div>
    <div id="header-container"></div>
    
    <div class="bg-light py-5 mb-5 border-bottom">
        <div class="container text-center">
            <h1 class="fw-bold display-5 mb-3">Our Products</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Products</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container mb-5 min-vh-50">
        <div class="row mb-5 align-items-center bg-white p-3 rounded shadow-sm">
            <div class="col-md-6 d-flex align-items-center mb-3 mb-md-0">
                <label for="cat-filter" class="fw-bold me-3 text-nowrap">Category:</label>
                <select class="form-select form-select-sm w-auto" id="cat-filter">
                    <option value="all">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="home">Home & Living</option>
                </select>
            </div>
            <div class="col-md-6 d-flex justify-content-md-end align-items-center">
                <label for="sort-filter" class="fw-bold me-3 text-nowrap">Sort By:</label>
                <select class="form-select form-select-sm w-auto" id="sort-filter">
                    <option value="default">Default sorting</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
        </div>
        <div class="row" id="products-grid">
            <!-- Dynamic products -->
        </div>
    </div>

    <div id="footer-container"></div>
    <button id="scrollToTop" class="btn btn-primary"><i class="fas fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
